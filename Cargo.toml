[package]
name = "makepad-stitch"
version = "0.1.0"
edition = "2024"
description = "An experimental Wasm interpreter written in Rust that is designed to be very fast and lightweight."
license = "MIT"
readme = "README.md"
repository = "https://github.com/makepad/stitch"

# This interpreter is tail-call threaded: every instruction handler ends by tail-calling
# the next one. It relies on LLVM turning those into jumps, otherwise a long-running guest
# grows the native stack until it overflows. `debug-assertions = false` is required for
# that optimization to happen (with it on, the tail calls are not eliminated); `opt-level`
# must be >= 1 as well. Without both, `cargo test`/`cargo run` overflow the stack.
[profile.dev]
opt-level = 1
debug-assertions = false

[dev-dependencies]
criterion = "0.5.1"
wast = "200.0.0"

[[bench]]
name = "benches"
harness = false
